[project]
name = "metacosdf"
version = "0.1.0"
description = "Meta-learning Co-SDF across scenes"
readme = "README.md"
authors = [
    { name = "Alexei Platzer", email = "alexeyplatzer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
cpu = ["torch"]
gpu = ["torch"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "NPY"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.101",
]
