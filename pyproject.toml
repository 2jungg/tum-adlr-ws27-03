[project]
name = "metacosdf"
version = "0.1.0"
description = "Meta-learning Co-SDF across scenes"
readme = "README.md"
authors = [
    { name = "Alexei Platzer", email = "alexeyplatzer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
cpu = ["torch"]
gpu = ["torch"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
